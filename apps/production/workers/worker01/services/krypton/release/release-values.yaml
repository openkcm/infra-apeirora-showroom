---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: krypton
spec:
  targetNamespace: services
  storageNamespace: services
  values:
    imagePullSecrets: []
    image:
      repository: images/krypton/root
      tag: "${KRYPTON_ROOT_IMAGE_TAG}"
      digest: "${KRYPTON_ROOT_IMAGE_DIGEST}"
      command: ["/app/root"]
    extraEnvs:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: krypton-secret
            key: database-url
      - name: KRYPTON_ROOT_KEY
        valueFrom:
          secretKeyRef:
            name: krypton-secret
            key: root-key
    extraVolumes:
      - name: kmip-server-tls
        secret:
          secretName: kmip-server-tls
      - name: vault-data
        persistentVolumeClaim:
          claimName: krypton-root-vault-data
    extraVolumeMounts:
      - name: kmip-server-tls
        mountPath: /etc/kmip/tls
        readOnly: true
      - name: vault-data
        mountPath: /vault-data
    ports:
      - name: kmip
        containerPort: 5697
        protocol: TCP
    service:
      ports:
        - name: grpc
          protocol: TCP
          port: 8080
          targetPort: 8080
        - name: kmip
          protocol: TCP
          port: 5697
          targetPort: 5697
    config:
      kmip:
        bind_addr: "0.0.0.0"
        port: 5697
        tls:
          server_cert: /etc/kmip/tls/tls.crt
          server_key: /etc/kmip/tls/tls.key
          client_ca: /etc/kmip/tls/ca.crt
      role: root
      segment:
        end_kind: L4
        start_kind: L1
      selector_labels:
        environment: local
      hierarchy:
        key_specs:
          - algorithm: AES256
            kind: L1
            labels_spec:
              allow_user_labels: true
            role: root
          - algorithm: AES256
            kind: L2
            labels_spec:
              allow_user_labels: true
            role: kek
          - algorithm: AES256
            kind: L3
            labels_spec:
              allow_user_labels: true
            role: kek
          - algorithm: AES256
            kind: L4
            labels_spec:
              allow_user_labels: true
            role: dek
        name: demo-hierarchy
      key_bindings:
        L1:
          sealer:
            config:
              secret:
                config:
                  name: KRYPTON_ROOT_KEY
                type: envvar
            name: root-key-sealer
            type: aes256gcm-staticsecret
        L2:
          crypto:
            name: kek-crypto
            type: aes256gcm
          vault:
            name: kek-vault
            type: unsafe-sqlite
            config:
              path: /vault-data/kek.db
        L3:
          crypto:
            name: kek-crypto
            type: aes256gcm
          vault:
            name: kek-vault
            type: unsafe-sqlite
            config:
              path: /vault-data/kek.db
        L4:
          crypto:
            name: dek-crypto
            type: aes256gcm
          vault:
            name: dek-vault
            type: unsafe-sqlite
            config:
              path: /vault-data/dek.db
