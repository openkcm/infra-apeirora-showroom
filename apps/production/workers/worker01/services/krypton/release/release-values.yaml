---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: krypton
spec:
  targetNamespace: services
  storageNamespace: services
  values:
    image:
      registry: ghcr.io/openkcm
      repository: krypton/images/root
      tag: "v0.1.0"
      command: ["/root/root.linux-amd64"]
      pullSecrets: []
    extraEnvs:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: krypton-secret
            key: database-url
      - name: KRYPTON_ROOT_KEY
        valueFrom:
          secretKeyRef:
            name: krypton-secret
            key: root-key
