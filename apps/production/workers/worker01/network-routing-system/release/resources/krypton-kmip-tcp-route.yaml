resources:
  krypton-kmip-tcp-route:
    apiVersion: gateway.networking.k8s.io/v1alpha2
    kind: TCPRoute
    metadata:
      name: krypton-kmip-tcp-route
    spec:
      parentRefs:
        - name: ingress-gateway
          namespace: envoy-gateway-system
          sectionName: kmip
      rules:
        - backendRefs:
            - group: ""
              kind: Service
              name: krypton-root
              namespace: services
              port: 5697
              weight: 1
  krypton-kmip-routeref:
    apiVersion: gateway.networking.k8s.io/v1beta1
    kind: ReferenceGrant
    metadata:
      name: krypton-kmip-routeref
      namespace: services
    spec:
      from:
        - group: gateway.networking.k8s.io
          kind: TCPRoute
          namespace: envoy-gateway-system
      to:
        - group: ""
          kind: Service
          name: krypton-root
