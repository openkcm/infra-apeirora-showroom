resources:
  grafana-http-route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: HTTPRoute
    metadata:
      name: grafana-http-route
    spec:
      parentRefs:
        - name: ingress-gateway
          namespace: envoy-gateway-system
      hostnames:
        - "grafana.worker01.kms.shoot.gardener.cc-one.showroom.apeirora.eu"
      rules:
        - backendRefs:
            - group: ""
              kind: Service
              name: kube-prometheus-stack-grafana
              namespace: monitoring
              port: 80
              weight: 1
          matches:
            - path:
                type: PathPrefix
                value: /
