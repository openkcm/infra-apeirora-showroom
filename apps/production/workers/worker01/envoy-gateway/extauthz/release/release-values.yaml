apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: extauthz
spec:
  storageNamespace: envoy-gateway-system
  targetNamespace: envoy-gateway-system
  dependsOn:
    - name: extauthz--pre-release
  values:
    image:
      tag: "${EXTAUTHZ_IMAGE_TAG}"
      digest: "${EXTAUTHZ_IMAGE_DIGEST}"
    hpa:
      minReplicas: 1
