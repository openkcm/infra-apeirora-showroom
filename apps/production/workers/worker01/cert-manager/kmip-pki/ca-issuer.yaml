apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: kmip-selfsigned
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kmip-ca
  namespace: services
spec:
  isCA: true
  commonName: kmip-ca
  secretName: kmip-ca-secret
  duration: 87600h  # 10 years
  issuerRef:
    name: kmip-selfsigned
    kind: ClusterIssuer
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: kmip-ca-issuer
  namespace: services
spec:
  ca:
    secretName: kmip-ca-secret
