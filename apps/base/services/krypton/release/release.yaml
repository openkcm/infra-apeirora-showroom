---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: krypton
spec:
  targetNamespace: services
  storageNamespace: services
  chartRef:
    kind: OCIRepository
    name: krypton
  interval: 10m
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: 5
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 5
      remediateLastFailure: true
  dependsOn:
    - name: postgresql--post-release
  values:
    fullnameOverride: "krypton"
    imagePullSecrets: []
    image:
      registry: ghcr.io
      repository: openkcm/images/krypton-root
      tag: v0.1.0
    service:
      port: 8080
    extraEnv:
      - name: DATABASE_URL
        valueFrom:
          secretKeyRef:
            name: krypton-secret
            key: database-url
      - name: KRYPTON_ROOT_KEY
        valueFrom:
          secretKeyRef:
            name: krypton-secret
            key: root-key
