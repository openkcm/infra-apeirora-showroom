---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: krypton
spec:
  targetNamespace: services
  storageNamespace: services
  chartRef:
    kind: OCIRepository
    name: krypton
  interval: 10m
  timeout: 10m
  install:
    createNamespace: false
    remediation:
      retries: 5
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 5
      remediateLastFailure: true
  dependsOn:
    - name: postgresql--post-release
    - name: krypton-local-secret-sync
