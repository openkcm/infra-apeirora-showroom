resources:
  krypton-grpc-route:
    apiVersion: gateway.networking.k8s.io/v1
    kind: GRPCRoute
    metadata:
      name: krypton-grpc-route
    spec:
      parentRefs:
        - name: ingress-gateway
          namespace: envoy-gateway-system
      hostnames:
        - "ing.<replace>.<replace>.kms.cloud.sap"
      rules:
        - backendRefs:
            - group: ""
              kind: Service
              name: krypton-root
              namespace: services
              port: 8080
              weight: 1
          matches:
            - method:
                service: "krypton.v1.admin.TenantService"
                method: "CreateTenant"
            - method:
                service: "krypton.v1.admin.TenantService"
                method: "GetTenant"
            - method:
                service: "krypton.v1.admin.TenantService"
                method: "ListTenants"
        - backendRefs:
            - group: ""
              kind: Service
              name: krypton-root
              namespace: services
              port: 8080
              weight: 1
          matches:
            - method:
                service: "krypton.v1.admin.keys.KeyService"
                method: "AnnounceKey"
            - method:
                service: "krypton.v1.admin.keys.KeyService"
                method: "ActivateKey"
            - method:
                service: "krypton.v1.admin.keys.KeyService"
                method: "GetKey"
            - method:
                service: "krypton.v1.admin.keys.KeyService"
                method: "GetParentKeys"
            - method:
                service: "krypton.v1.admin.keys.KeyService"
                method: "GetDescendantKeys"
            - method:
                service: "krypton.v1.admin.keys.KeyService"
                method: "ListKeys"
