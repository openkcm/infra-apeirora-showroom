apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: extauthz
spec:
  chartRef:
    kind: OCIRepository
    name: extauthz
  interval: 10m
  install:
    createNamespace: false
    remediation:
      retries: -1
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: -1
      remediateLastFailure: true
  releaseName: extauthz
  values:
    extraEnvs:
      - name: DEBUGFEATURES
        value: smdumptransport=1
    fullnameOverride: extauthz
    image:
      registry: ghcr.io/openkcm
      repository: images/extauthz
      digest: sha256:5918d421c6e72e3d9d6b16a629a58031505531fe84d222367110f6de5525e9de
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 6
      targetCPUUtilizationPercentage: 85
      targetMemoryUtilizationPercentage: 90
    resources:
      requests:
        cpu: 300m
        memory: 512Mi
    pod:
      annotations:
        linkerd.io/inject: enabled
      labels:
        service.cmk.kms.cloud.sap/instance: extauthz
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: service.cmk.kms.cloud.sap/instance
                      operator: In
                      values:
                        - extauthz
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchExpressions:
              - key: service.cmk.kms.cloud.sap/instance
                operator: In
                values:
                  - extauthz
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchExpressions:
              - key: service.cmk.kms.cloud.sap/instance
                operator: In
                values:
                  - extauthz
    extraPorts:
      - name: grpc
        protocol: TCP
        containerPort: 9092
      - name: http-status
        protocol: TCP
        containerPort: 8888
    service:
      type: ClusterIP
      ports:
        - name: grpc
          protocol: TCP
          port: 9092
          targetPort: 9092
        - name: http-status
          protocol: TCP
          port: 8888
          targetPort: 8888
    extraVolumes:
      - name: extauthz-trusted-subjects-vol
        configMap:
          name: extauthz-trusted-subjects
      - name: extauthz-policies-volume
        projected:
          sources:
            - configMap:
                name: extauthz-system-policies
            - configMap:
                name: extauthz-user-policies
      - name: extauthz-signing-keys-volume
        projected:
          sources:
            - secret:
                name: extauthz-signing-keys-secret
      - name: keycloak-volume
        secret:
          secretName: oidc-proxy
      - name: csrf-secret
        secret:
          secretName: csrf-secret
          items:
            - key: csrf_secret
              path: csrf_secret
    extraVolumeMounts:
      - name: extauthz-trusted-subjects-vol
        mountPath: /etc/extauthz-mtls
        readOnly: true
      - name: extauthz-policies-volume
        mountPath: /etc/extauthz-policies
        readOnly: true
      - mountPath: /etc/extauthz-signing
        name: extauthz-signing-keys-volume
        readOnly: true
      - mountPath: /etc/credentials/keycloak
        name: keycloak-volume
        readOnly: true
      - name: csrf-secret
        mountPath: /etc/credentials/csrf-secret
        readOnly: true
    livenessProbe:
      httpGet:
        path: /probe/liveness
        port: http-status
        scheme: HTTP
      failureThreshold: 1
      periodSeconds: 10
    readinessProbe:
      httpGet:
        path: /probe/readiness
        port: http-status
        scheme: HTTP
      failureThreshold: 1
      periodSeconds: 10
    config:
      # Based on github.tools.sap/kms/common-sdk/pkg/commoncfg
      environment: development
      logger:
        level: debug # one of: debug, info, warn, error
        format: json # one of: json, text

      status: # status server configuration
        enabled: true
        address: :8888
        profiling: true

      featureGates:
        enrich-header-with-client-type: true
        enrich-header-with-client-region: true
        disable-client-certificate-computation: false
        disable-jwt-token-computation: false

      # Based on github.com/openkcm/extauthz/pkg/config
      grpcServer:
        address: :9092
        flags:
          health: true

      cedar:
        policyPath: /etc/extauthz-policies

      # Client Certificate handling
      mtls:
        trustedSubjectsYaml: /etc/extauthz-mtls/trustedSubjects.yaml

      # JWT Token handling
      jwt:
        issuerClaimKeys:
          - iss
        providers:
          - issuer: https://ing.worker01.kms.shoot.gardener.cc-one.showroom.apeirora.eu/auth/realms/master
            disableTokenIntrospection: true
            audiences:
              - test
              - account
        httpClient:
          basicAuth:
            username:
              source: file
              file:
                path: /etc/credentials/keycloak/client-id
                format: binary
            password:
              source: file
              file:
                path: /etc/credentials/keycloak/client-secret
                format: binary

      sessionPathPrefixes: ["/cmk/v1/"]
      sessionManager:
        enabled: true
        address: session-manager.services.svc.cluster.local:9091
        secretRef:
          type: insecure
      clientData:
        signingKeyIDFilePath: /etc/extauthz-signing/keyId
      csrfSecret:
        source: file
        file:
          format: binary
          path: /etc/credentials/csrf-secret/csrf_secret
