---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: krypton-operator
spec:
  targetNamespace: krypton-operator
  storageNamespace: krypton-operator
  chartRef:
    kind: OCIRepository
    name: krypton-operator
  interval: 10m
  timeout: 10m
  install:
    createNamespace: true
    remediation:
      retries: 5
      remediateLastFailure: true
  upgrade:
    remediation:
      retries: 5
      remediateLastFailure: true
  values:
    fullnameOverride: "krypton-operator"
    imagePullSecrets: []
    image:
      registry: ghcr.io/openkcm
      repository: images/krypton-operator
      tag: v0.7.0
      digest: sha256:691cb0cd4c61da4b4afc8f5a41261b0d184cc7b91b997831b8163d5ddac24bf2
    resources:
      limits:
        cpu: 500m
        memory: 1Gi
      requests:
        cpu: 1000m
        memory: 2Gi
